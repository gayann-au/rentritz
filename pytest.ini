[pytest]
testpaths = tests

# Import `app`, `config` and `tests.conftest` from the repo root without
# needing an editable install.
pythonpath = .

# The suite talks to a real PostgreSQL database over the network, so keep the
# output terse and surface the slowest tests.
addopts = -q --strict-markers --durations=10

filterwarnings =
    # Raised from inside Flask-SQLAlchemy's own Query.get() shim, not our code.
    ignore::sqlalchemy.exc.LegacyAPIWarning
