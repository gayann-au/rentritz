<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rentritz - Management</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;background:#0f0f0f;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .box{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:48px 40px;width:100%;max-width:400px}
    .logo{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#f59e0b;margin-bottom:32px}
    h1{font-size:22px;font-weight:600;margin-bottom:8px}
    p{font-size:14px;color:#666;margin-bottom:32px}
    label{display:block;font-size:13px;font-weight:500;color:#aaa;margin-bottom:6px}
    input{width:100%;padding:12px 14px;background:#111;border:1px solid #333;border-radius:8px;color:#fff;font-size:15px;outline:none;margin-bottom:20px}
    input:focus{border-color:#f59e0b}
    button{width:100%;padding:13px;background:#f59e0b;color:#000;font-weight:600;font-size:15px;border:none;border-radius:8px;cursor:pointer}
    button:hover{background:#d97706}
    .error{background:#3b0000;border:1px solid #7f1d1d;color:#fca5a5;padding:12px;border-radius:8px;font-size:14px;margin-bottom:20px}
    .pw-wrap{position:relative;margin-bottom:20px}
    .pw-wrap input{padding-right:44px;margin-bottom:0}
    .pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#555;padding:4px;display:flex;align-items:center;line-height:1}
    .pw-toggle:hover{color:#f59e0b}
    .pw-toggle svg{display:block}
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">Rentritz Dubai</div>
    <h1>Management Access</h1>
    <p>Authorised personnel only.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="error">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Email</label>
      <input type="email" name="email" required autofocus>
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="admin-password" name="password" required>
        <button type="button" class="pw-toggle" aria-label="Show password" data-target="admin-password">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <button type="submit">Sign In</button>
    </form>
  </div>
<script>
document.querySelectorAll('.pw-toggle').forEach(function(btn) {
    btn.addEventListener('click', function() {
        var input = document.getElementById(this.dataset.target);
        var isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        this.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
        this.innerHTML = isHidden
            ? '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
            : '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    });
});
</script>
</body>
</html>
