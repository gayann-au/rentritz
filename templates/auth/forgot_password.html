{% extends 'base.html' %}
{% block title %}Forgot Password | Rentritz Dubai{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-header">
            <a href="{{ url_for('core.index') }}" class="auth-logo">Rentritz <span>Dubai</span></a>
            <h1>Reset your password</h1>
            <p>Enter your email and we'll send you a reset link</p>
        </div>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">

            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com"
                       value="{{ request.form.get('email', '') }}" required autocomplete="email">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Send reset link</button>
        </form>

        <div class="auth-footer">
            Remembered it? <a href="{{ url_for('auth.login') }}">Back to sign in</a>
        </div>
    </div>
</div>
{% endblock %}
