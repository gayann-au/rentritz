{% extends 'base.html' %}
{% block title %}Sign In — Rentritz Dubai{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-header">
            <a href="{{ url_for('core.index') }}" class="auth-logo">Rentritz <span>Dubai</span></a>
            <h1>Welcome back</h1>
            <p>Sign in to access your consultations</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">

            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com"
                       value="{{ request.form.get('email', '') }}" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Your password" required autocomplete="current-password">
            </div>

            <div class="form-row-split">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember"> Keep me signed in
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Sign in</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Create one free</a>
        </div>
    </div>
</div>
{% endblock %}
