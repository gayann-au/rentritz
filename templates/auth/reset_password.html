{% extends 'base.html' %}
{% block title %}Set New Password — Rentritz Dubai{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-header">
            <a href="{{ url_for('core.index') }}" class="auth-logo">Rentritz <span>Dubai</span></a>
            <h1>Set a new password</h1>
            <p>Choose a strong password for your account</p>
        </div>

        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">

            <div class="form-group">
                <label for="password">New password <span class="text-muted text-sm">(min. 8 characters)</span></label>
                <input type="password" id="password" name="password"
                       placeholder="Create a new password" required autocomplete="new-password" minlength="8">
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm new password</label>
                <input type="password" id="confirm_password" name="confirm_password"
                       placeholder="Repeat your new password" required autocomplete="new-password" minlength="8">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Set new password</button>
        </form>

        <div class="auth-footer">
            <a href="{{ url_for('auth.forgot_password') }}">Request a new link</a>
        </div>
    </div>
</div>
{% endblock %}
